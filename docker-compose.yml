version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: amblyopia-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro
    depends_on:
      - web
      - api
      - socket
    networks:
      - amblyopia-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: amblyopia-web
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    networks:
      - amblyopia-network

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: amblyopia-api
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=amblyopia123
      - DB_NAME=amblyopia_training
      - JWT_SECRET=change-this-in-production
      - CLIENT_URL=http://localhost
    expose:
      - "3001"
    depends_on:
      - mysql
      - redis
    networks:
      - amblyopia-network

  socket:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: amblyopia-socket
    command: node dist/index.js
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=amblyopia123
      - DB_NAME=amblyopia_training
      - JWT_SECRET=change-this-in-production
      - CLIENT_URL=http://localhost
    expose:
      - "3002"
    depends_on:
      - mysql
      - redis
    networks:
      - amblyopia-network

  mysql:
    image: mysql:8.0
    container_name: amblyopia-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=amblyopia123
      - MYSQL_DATABASE=amblyopia_training
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "3306"
    networks:
      - amblyopia-network

  redis:
    image: redis:alpine
    container_name: amblyopia-redis
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - amblyopia-network

volumes:
  mysql_data:
  redis_data:

networks:
  amblyopia-network:
    driver: bridge
